services:
  - type: web
    name: the-last-informant
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: FISH_AUDIO_ENABLED
        value: "true"
      - key: FISH_AUDIO_MODEL
        value: s2.1-pro-free
      - key: FISH_AUDIO_BASE_URL
        value: https://api.fish.audio
